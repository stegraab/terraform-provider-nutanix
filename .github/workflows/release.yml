name: Manual Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch release tags
        run: |
          git fetch --tags origin
          git fetch --no-tags https://github.com/nutanix/terraform-provider-nutanix.git 'refs/tags/v*:refs/upstream-release-tags/v*'

      - name: Compute and create next tag
        id: next_tag
        shell: bash
        run: |
          set -euo pipefail

          # Old fork tags may be closer to a merge than its upstream release.
          # Select the highest stable upstream version already included in main.
          base_tag="$(
            git for-each-ref --merged=HEAD --sort=-version:refname \
              --format='%(refname:strip=2)' refs/upstream-release-tags |
              awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && !found {print; found=1}'
          )"
          if [[ -z "$base_tag" ]]; then
            echo "No stable upstream release tag is reachable from main"
            exit 1
          fi

          max_n=0
          while IFS= read -r t; do
            if [[ "$t" =~ -stegra[.-]([0-9]+)$ ]]; then
              n=$((10#${BASH_REMATCH[1]}))
              if (( n > max_n )); then
                max_n="$n"
              fi
            fi
          done < <(
            {
              git tag -l "${base_tag}-stegra.*"
              git tag -l "${base_tag}-stegra-*"
            } | sort -u
          )

          next_n=$((max_n + 1))
          next_tag="${base_tag}-stegra.${next_n}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next_tag" -m "Automated release tag $next_tag"
          git push origin "$next_tag"

          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
      - name: Import GPG key
        id: import_gpg
        uses: paultyng/ghaction-import-gpg@v2.1.0
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.PASSPHRASE }}

      - name: Set the user terminal
        run: export GPG_TTY=$(tty)

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6.4.0
        with:
          version: v2.13.3
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
